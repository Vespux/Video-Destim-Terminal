function normalizeCapsToken(token){

async function stats(){
  let scope=view.scope==="all"?"all":"period",scopeLabel=scope==="all"?"ALL TIME":"CURRENT PERIOD";
  app.innerHTML=head(`STATS / ${scopeLabel}`)+`<div>LOADING STATS...</div>`;
  try{
    let s=await api(`/api/stats?scope=${scope}`);
    let h=head(`STATS / ${scopeLabel}`);
    h+=trackingSinceLine(s.trackingSince);
    if(scope==="period"){
      h+=`<div class="tiny dim">PERIOD: ${new Date(s.periodStart).toLocaleDateString()} - ${new Date(s.periodEnd).toLocaleDateString()}</div>`;
      h+=`<div class="stat-section"><div class="stat-title">CURRENT ALLOWANCE PERIOD</div>`;
      h+=statRow("WATCHES REQUESTED",s.watchRequests);
      h+=statRow("CREDITS SPENT",s.creditsSpent);
      h+=statRow("CREDITS REMAINING",s.creditsRemaining);
      h+=statRow("ALLOWANCE USED",`${s.allowanceUsedPct}%`);
      h+=statRow("VIDEO TIME REQUESTED",fmtStatTime(s.videoSeconds));
      h+=`</div>`;
    }else{
      h+=`<div class="stat-section"><div class="stat-title">ALL TIME</div>`;
      h+=statRow("WATCH REQUESTS",s.watchRequests);
      h+=statRow("CREDITS SPENT",s.creditsSpent);
      h+=statRow("VIDEO TIME REQUESTED",fmtStatTime(s.videoSeconds));
      h+=`</div>`;
    }
    h+=`<div class="stat-section"><div class="stat-title">WATCH BEHAVIOR</div>`;
    h+=statRow("AVG. VIDEO LENGTH",fmtStatTime(s.avgVideoSeconds));
    h+=statRow("AVG. TIME BETWEEN REQUESTS",fmtStatTime(s.avgGapSeconds));
    h+=statRow("REWATCHES",s.rewatches);
    h+=statRow("MANUAL OVERRIDES",s.manualOverrides);
    h+=`</div>`;
    h+=`<div class="stat-section"><div class="stat-title">CREATORS</div>`;
    h+=statRow("UNIQUE CREATORS WATCHED",s.uniqueCreators);
    h+=statRow("MOST WATCHED CREATOR",s.mostWatchedCreator?`${s.mostWatchedCreator.name} (${s.mostWatchedCreator.count})`:"N/A");
    h+=`</div><hr>`;
    h+=item("[P] CURRENT PERIOD",()=>go("stats",{scope:"period"}),scope==="period");
    h+=item("[A] ALL TIME",()=>go("stats",{scope:"all"}),scope==="all");
    h+=item("[B] BACK",()=>go("home"));
    h+=commandPrompt();
    app.innerHTML=h;
  }catch(e){
    app.innerHTML=head(`STATS / ${scopeLabel}`)+`<div class="err">${esc(e.message)}</div><div class="space"></div>`+item("[B] BACK",()=>go("home"))+commandPrompt();
  }
}

function fmtBytes(bytes){
  bytes=Math.max(0,Number(bytes)||0);
  if(bytes<1024)return`${bytes} B`;
  if(bytes<1024*1024)return`${(bytes/1024).toFixed(1)} KB`;
  return`${(bytes/(1024*1024)).toFixed(1)} MB`;
}

function reorder(){if(!reorderDraft)reorderDraft=copy(st.creators);reorderDirty=reorderChanged();let h=head("CONFIG / REORDER CREATORS");reorderDraft.forEach((c,i)=>h+=`<div>${creatorPrefix(i+1,reorderDraft.length)}${esc(c.name)}</div>`);h+=`<hr>`+item("[N] SORT BY NAME",()=>{reorderDraft.sort((a,b)=>a.name.localeCompare(b.name,undefined,{sensitivity:"base"}));reorderDirty=reorderChanged();reorder()})+item("[D] SORT BY DATE ADDED",()=>{reorderDraft.sort((a,b)=>(Number(a.addedAt)||Number(a.id))-(Number(b.addedAt)||Number(b.id)));reorderDirty=reorderChanged();reorder()})+`<hr><div>MANUAL SORT</div><div class="space"></div><div>MOVE CREATOR #:</div><input id="from" type="number" inputmode="numeric" min="1" max="${reorderDraft.length}"><div class="space"></div><div>NEW POSITION:</div><input id="to" type="number" inputmode="numeric" min="1" max="${reorderDraft.length}"><div class="space"></div>`+item("[M] MOVE",()=>{let f=parseInt(document.getElementById("from").value)-1,t=parseInt(document.getElementById("to").value)-1;if(!Number.isInteger(f)||!Number.isInteger(t)||f<0||t<0||f>=reorderDraft.length||t>=reorderDraft.length)return showError("INVALID CREATOR POSITION.",()=>go("reorder"));let moved=reorderDraft.splice(f,1)[0];reorderDraft.splice(t,0,moved);reorderDirty=reorderChanged();reorder()})+`<hr>`+item("[S] SAVE",()=>saveReorder({name:"config"}))+item("[C] CANCEL",()=>{clearReorder();go("config")})+item("[B] BACK",()=>leaveReorder());if(reorderDirty)h+=`<div class="tiny warn">UNSAVED CHANGES</div>`;h+=commandPrompt();app.innerHTML=h}
function tickCreatorCooldown(){if(view.name!=="creators")return;let c=cooldownMs(),el=document.getElementById("creatorCooldown");if(c<=0){creators();return}if(el)el.textContent=`COOLDOWN REMAINING: ${rem(c)}`;setTimeout(tickCreatorCooldown,1000)}

ADD ONE IN CONFIG.</div>`;

function overridePin(msg=""){let h=head("REQUEST A WATCH / MANUAL OVERRIDE");h+=`<div>ENTER OVERRIDE PIN:</div><div class="space"></div><input id="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off">`;if(msg)h+=`<div class="err">${esc(msg)}</div>`;h+=`<div class="space"></div>`+item("[U] UNLOCK",async()=>{let code=document.getElementById("pin").value;try{await api("/api/override/check",{method:"POST",body:{pin:code}});overridePinValue=code;go("creators")}catch(e){overridePin(e.message)}})+item("[C] CANCEL",()=>go("creators"))+commandPrompt();app.innerHTML=h;setTimeout(()=>document.getElementById("pin")?.focus(),50)}
function fmtDur(s){let h=Math.floor(s/3600),m=Math.floor((s%3600)/60);return h?`${h}h ${String(m).padStart(2,"0")}m`:`${m}m`}
async function toggleSavedVideo(x,creator,returnTarget){
  try{
    if(x.saved){
      await api(`/api/saved/${encodeURIComponent(x.id)}`,{method:"DELETE"});
    }else{
      await api(`/api/saved/${encodeURIComponent(x.id)}`,{method:"PUT",body:{creatorId:creator?.id??x.creatorId??null,creatorName:creator?.name??x.creatorName??"UNKNOWN CREATOR",videoTitle:x.rawTitle||x.title,publishedAt:x.publishedAt||null,durationSeconds:x.durationSeconds||0}});
    }
    goTarget(returnTarget);
  }catch(e){showError(e.message,()=>goTarget(returnTarget))}
}

PROCEED? [Y/N]</div><div class="space"></div>`+item("[Y] YES",()=>proceed(),false,true)+item("[N] NO",()=>goTarget(back))+commandPrompt();

let watchRequestPending=false;
async function proceed(){
  if(watchRequestPending)return;
  watchRequestPending=true;
  let videoTab=null;
  try{
    let confirmView={...view},x=view.video,cid=view.cid,sort=view.sort,creator=st.creators.find(y=>y.id===cid),creatorName=creator?.name||view.creatorName||x.creatorName||"UNKNOWN CREATOR",rv=view.source==="saved"?{name:"savedVideos"}:{name:"videos",cid,sort};
    try{
      videoTab=window.open("about:blank","_blank");
      if(videoTab){videoTab.opener=null;videoTab.document.title="VDT — Opening video";videoTab.document.body.textContent="Processing your watch request…";}
    }catch(e){try{videoTab?.close()}catch(_){}videoTab=null;}
    if(!videoTab){
      showError("NEW TAB BLOCKED. ALLOW POP-UPS FOR VDT AND TRY AGAIN.",()=>goTarget(confirmView));
      return;
    }
    app.innerHTML=head("REQUEST A WATCH")+`<div>COMMITTING WATCH REQUEST...</div>`;
    let data;
    try{
      data=await api("/api/watch",{method:"POST",body:{videoId:x.id,creatorId:cid,creatorName,videoTitle:x.rawTitle||x.title,durationSeconds:x.durationSeconds,overridePin:overridePinValue}});
    }catch(e){
      try{videoTab.close()}catch(_){}
      app.innerHTML=head("REQUEST A WATCH")+`<div class="err">${esc(e.message)}</div>`+item("[B] BACK",()=>goTarget(rv))+commandPrompt();
      return;
    }
    st=data.state;stateFetchedAt=Date.now();overridePinValue=null;
    try{sessionStorage.setItem("videoDestimReturnView",JSON.stringify(rv))}catch(e){}
    view=rv;
    let opened=false;
    try{if(!videoTab.closed){videoTab.location.replace(data.url);opened=true;}}catch(e){try{videoTab.close()}catch(_){} }
    if(opened){render();}
    else{
      app.innerHTML=head("REQUEST A WATCH")+`<div>WATCH REQUEST RECORDED.</div><div>OPEN YOUR VIDEO BELOW.</div><div class="space"></div><a class="item" data-shortcut="O" href="${esc(data.url)}" target="_blank" rel="noopener">[O] OPEN VIDEO</a>`+item("[B] BACK",()=>goTarget(rv))+commandPrompt();
    }
  }finally{watchRequestPending=false;}
}
function render(){if(!st)return;({home,stats,about,readDoc,history,diag,flushCache,creditEject,legal,support,deleteData,signal,config,configLeave,amount,cooldown,creatorCfg,addCreator,removeCreator,reorder,reorderLeave,creators,override:overridePin,videos,savedVideos,confirm}[view.name]||home)()}

let numericShortcutBuffer="",numericShortcutTimer=null;
function typingTarget(el){
  if(!el)return false;
  let tag=(el.tagName||"").toLowerCase();
  return tag==="input"||tag==="textarea"||tag==="select"||el.isContentEditable;
}
function enabledShortcutButtons(){
  return [...document.querySelectorAll('button[data-shortcut]:not(.disabled)')].filter(b=>!b.disabled&&b.offsetParent!==null);
}
function clickShortcut(key){
  key=String(key).toLowerCase();
  let btn=enabledShortcutButtons().find(b=>String(b.dataset.shortcut).toLowerCase()===key);
  if(!btn)return false;
  btn.click();
  return true;
}
function clearNumericShortcut(){
  numericShortcutBuffer="";
  if(numericShortcutTimer){clearTimeout(numericShortcutTimer);numericShortcutTimer=null}
}
function handleNumericShortcut(digit){
  let buttons=enabledShortcutButtons();
  let keys=[...new Set(buttons.map(b=>b.dataset.shortcut).filter(k=>/^\d+$/.test(k)))];
  if(!keys.length)return false;

  let proposed=numericShortcutBuffer+digit;
  let candidates=keys.filter(k=>k.startsWith(proposed));

  if(!candidates.length){
    proposed=digit;
    candidates=keys.filter(k=>k.startsWith(proposed));
    if(!candidates.length){clearNumericShortcut();return false}
  }

  numericShortcutBuffer=proposed;
  if(numericShortcutTimer)clearTimeout(numericShortcutTimer);

  let exact=keys.includes(proposed);
  let longer=candidates.some(k=>k!==proposed);

  if(exact&&!longer){
    let key=numericShortcutBuffer;
    clearNumericShortcut();
    return clickShortcut(key);
  }

  numericShortcutTimer=setTimeout(()=>{
    let key=numericShortcutBuffer;
    clearNumericShortcut();
    if(keys.includes(key))clickShortcut(key);
  },500);
  return true;
}
function clickEscapeAction(){
  if(clickShortcut("b"))return true;
  if(clickShortcut("c"))return true;
  if((view.name==="confirm"||view.name==="reorderLeave"||view.name==="configLeave"||view.name==="creditEject"||view.name==="flushCache")&&clickShortcut("n"))return true;
  return false;
}
document.addEventListener("keydown",e=>{
  if(e.defaultPrevented||e.ctrlKey||e.metaKey||e.altKey)return;
  if(typingTarget(e.target)||typingTarget(document.activeElement))return;

  let key=e.key;

  if(key==="Escape"){
    clearNumericShortcut();
    if(clickEscapeAction())e.preventDefault();
    return;
  }

  if(key==="Enter"){
    clearNumericShortcut();
    let btn=document.querySelector('button[data-default="1"]:not(.disabled)');
    if(btn&&btn.offsetParent!==null){btn.click();e.preventDefault()}
    return;
  }

  if(/^\d$/.test(key)){
    if(handleNumericShortcut(key))e.preventDefault();
    return;
  }

  if(key.length===1&&/[a-z]/i.test(key)){
    clearNumericShortcut();
    if(clickShortcut(key))e.preventDefault();
  }
});

boot();
