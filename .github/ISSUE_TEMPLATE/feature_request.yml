name: Feature request
description: Suggest an improvement that fits the low-stimulation project goal
title: "[FEATURE] "
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: checkboxes
    id: principles
    attributes:
      label: Project fit
      options:
        - label: This does not require telemetry/analytics.
          required: true
        - label: This preserves the low-stimulation/text-first goal.
          required: true
